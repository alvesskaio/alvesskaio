name: Update GitHub stats cards

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate stats SVG
        uses: cicirello/user-statistician@v1
        with:
          image-file: assets/userstats.svg
          colors: dark
          include-title: true
          custom-title: 'Estatísticas do GitHub'
          category-order: repositories, contributions
          commit-and-push: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages SVG
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&hide_border=true&bg_color=0d1117&title_color=58a6ff&text_color=c9d1d9&langs_count=8
          path: assets/toplangs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/userstats.svg assets/toplangs.svg
          git diff --cached --quiet || git commit -m "Update GitHub stats cards"
          git push
